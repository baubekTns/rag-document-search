services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    environment:
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-document_chunks}
      - QDRANT_TIMEOUT_SECONDS=${QDRANT_TIMEOUT_SECONDS:-10}
      - SQLITE_DATABASE_PATH=${SQLITE_DATABASE_PATH:-data/documents.db}
      - UPLOAD_DIRECTORY=${UPLOAD_DIRECTORY:-uploads}
      - UPLOAD_STAGING_DIRECTORY=${UPLOAD_STAGING_DIRECTORY:-uploads/.staging}
      - MAX_UPLOAD_SIZE_BYTES=${MAX_UPLOAD_SIZE_BYTES:-10485760}
      - UPLOAD_STREAM_CHUNK_SIZE=${UPLOAD_STREAM_CHUNK_SIZE:-65536}
      - INGESTION_CONCURRENCY=${INGESTION_CONCURRENCY:-2}
      - EMBEDDING_CONCURRENCY=${EMBEDDING_CONCURRENCY:-1}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-120}
      - OLLAMA_MAX_OUTPUT_TOKENS=${OLLAMA_MAX_OUTPUT_TOKENS:-512}
      - OLLAMA_MAX_RETRIES=${OLLAMA_MAX_RETRIES:-1}
      - READINESS_TIMEOUT_SECONDS=${READINESS_TIMEOUT_SECONDS:-2}
    depends_on:
      - qdrant

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
